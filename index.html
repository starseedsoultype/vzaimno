<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Взаимно</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --accent: var(--tg-theme-button-color, #2a9df4);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { padding: 16px 16px 88px; max-width: 520px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--bg2); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; padding: 14px 0; border: 0; background: none; color: var(--hint); font-size: 15px; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
  .chip { flex: none; padding: 8px 14px; border-radius: 18px; border: 0; background: var(--bg2); color: var(--text); font-size: 14px; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--bg2); border-radius: 20px; padding: 24px 20px; text-align: center; }
  .card h2 { margin: 0 0 6px; font-size: 22px; }
  .ava-btn { border: 0; background: none; padding: 0; display: block; margin: 0 auto; }
  .ava { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
    object-fit: cover; background: var(--accent); color: var(--accent-text); font-size: 40px; font-weight: 600; }
  .rating { color: var(--hint); font-size: 14px; }
  .task { margin: 18px 0 6px; font-weight: 600; }
  .link { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--accent); background: none; color: var(--accent); font-size: 16px; word-break: break-all; }
  .safe { color: var(--hint); font-size: 12px; margin-top: 8px; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--hint); font-weight: 400; }
  .btn.red { background: none; color: var(--danger); border: 1px solid var(--danger); font-weight: 400; }
  .paste { margin-top: 10px; color: var(--hint); font-size: 13px; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
  .shot { width: 100%; border-radius: 12px; margin-top: 12px; }
  .item { margin-bottom: 16px; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--hint); }
  input[type=url] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--bg2); background: var(--bg2); color: var(--text); font-size: 15px; }
  input.bad { border-color: var(--danger); }
  .me { text-align: center; margin-bottom: 8px; }
  #done { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 85%, transparent); }
  #done.show { display: flex; }
  #done svg { width: 160px; height: 160px; }
  #done circle { fill: var(--accent); transform-origin: center; animation: pop .35s ease-out; }
  #done path { fill: none; stroke: var(--accent-text); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .45s .25s ease-out forwards; }
  .sheet { position: fixed; inset: 0; display: none; align-items: flex-end; background: rgba(0,0,0,.4); }
  .sheet.show { display: flex; }
  .sheet-box { width: 100%; background: var(--bg); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
  .report { margin-top: 12px; border: 0; background: none; color: var(--hint); font-size: 13px; text-decoration: underline; }
  .bonus { margin-top: 10px; text-align: center; font-weight: 700; font-size: 15px; }
  .rules b { display: block; margin-top: 16px; font-size: 17px; }
  .rules p { margin: 6px 0 0; }
  .adm { text-align: left; }
  .adm .ava { width: 96px; height: 96px; font-size: 36px; margin: 0 0 10px; }
  .adm .meta { color: var(--hint); font-size: 13px; margin-top: 4px; word-break: break-all; }
  .adm .row { flex-wrap: wrap; }
  .adm .btn { flex: 1 1 30%; padding: 10px; font-size: 14px; }
  nav button[hidden] { display: none; }
  .progress { background: var(--bg2); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .progress .nums { display: flex; justify-content: space-between; gap: 8px; }
  .progress .bar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--hint) 25%, transparent); margin-top: 10px; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s ease; }
  .progress .goal { margin-top: 6px; color: var(--hint); font-size: 13px; }
  .cover { width: 120px; border-radius: 8px; margin: 4px auto 12px; display: block; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 12px; line-height: 18px; }
  #toasts { position: fixed; top: 12px; left: 16px; right: 16px; display: grid; gap: 8px; pointer-events: none; z-index: 10; }
  .toast { background: var(--accent); color: var(--accent-text); padding: 12px 14px; border-radius: 14px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.2); animation: toast 3.2s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-16px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-16px); } }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.1); } to { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="feed" class="on">Лента</button>
  <button data-tab="inbox">Входящие</button>
  <button data-tab="profile">Профиль</button>
  <button data-tab="rules">Правила</button>
  <button data-tab="admin" id="nav-admin" hidden>Админ</button>
</nav>
<div id="sheet" class="sheet">
  <div class="sheet-box">
    <div class="task">На что жалоба?</div>
    <button class="btn red" data-reason="scam">Скам-ссылка</button>
    <button class="btn red" data-reason="fake">Фейковые скрины</button>
    <button class="btn red" data-reason="other">Другое</button>
    <button class="btn ghost" data-reason="">Отмена</button>
  </div>
</div>
<div id="toasts"></div>
<div id="done"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M28 52 L44 67 L73 36"/></svg></div>
<input id="file" type="file" accept="image/*" hidden>
<input id="ava" type="file" accept="image/*" hidden>

<script>
const API = "https://ogqtywdsplyqwfznqxnu.supabase.co/functions/v1/vzaimno";
const BOT = "vzaimnosub_bot";
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const FIELDS = {
  book:    { name: "Книга ЛитРес",   task: "Поставьте 5 звёзд книге", hint: "https://www.litres.ru/book/... или https://www.litres.ru/12345678/" },
  profile: { name: "Профиль ЛитРес", task: "Подпишитесь на профиль автора", hint: "https://www.litres.ru/author/..." },
  tg:      { name: "ТГ-группа",      task: "Подпишитесь на группу", hint: "https://t.me/..." },
  vk:      { name: "ВК",             task: "Подпишитесь на страницу", hint: "https://vk.com/..." },
  boosty:  { name: "Бусти",          task: "Подпишитесь на Бусти", hint: "https://boosty.to/..." },
  tiktok:  { name: "TikTok",         task: "Подпишитесь на TikTok", hint: "https://www.tiktok.com/@..." },
  insta:   { name: "Instagram",      task: "Подпишитесь на Instagram", hint: "https://www.instagram.com/..." },
};
const PATTERN = {
  book: /^https:\/\/(www\.)?litres\.ru\/(book\/\S+|\d+\/?)$/,
  profile: /^https:\/\/(www\.)?litres\.ru\/author\/[\w-]+\/?$/,
  tg: /^https:\/\/t\.me\/[\w+]+\/?$/,
  vk: /^https:\/\/(m\.)?vk\.(com|ru)\/[\w.]+\/?$/,
  boosty: /^https:\/\/(www\.)?boosty\.to\/[\w.-]+\/?(\?\S*)?$/,
  tiktok: /^https:\/\/(www\.)?tiktok\.com\/@[\w.]+\/?(\?\S*)?$/,
  insta: /^https:\/\/(www\.)?instagram\.com\/[\w.]+\/?(\?\S*)?$/,
};

const state = { tab: "feed", me: null, field: null, card: null, upload: null };
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(action, body = {}) {
  const ref = new URLSearchParams(location.search).get("ref");
  const r = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ initData: tg.initData, ref, action, ...body }),
  });
  return r.json();
}

function badge(r) {
  if (r == null) return "⚪ новичок";
  return `${r >= 80 ? "🟢" : r >= 50 ? "🟡" : "🔴"} ${r}% взаимности`;
}

// Фото из Telegram; если человек его скрыл, первая буква имени.
function avatar(c) {
  return c.photo
    ? `<img class="ava" src="${esc(c.photo)}" alt="">`
    : `<div class="ava">${esc((c.name ?? "?").slice(0, 1).toUpperCase())}</div>`;
}

// Обложка книги ЛитРес по номеру из ссылки; если её нет, картинка просто скрывается.
function cover(c) {
  const id = c.field === "book" && /(\d+)\/?$/.exec(c.url ?? "")?.[1];
  return id ? `<img class="cover" src="https://cdn.litres.ru/pub/c/cover_415/${id}.jpg" alt="" onerror="this.remove()">` : "";
}

function cardHtml(c, task) {
  return `${cover(c)}${avatar(c)}<h2>${esc(c.name)}</h2>
    <div class="rating">${badge(c.rating)}</div>
    <div class="task">${esc(task ?? FIELDS[c.field].task)}</div>
    <button class="link" data-open="${esc(c.url)}">${esc(c.url)}</button>
    <div class="safe">🔒 Ссылки проверены: только litres.ru, t.me, vk.com, boosty.to, tiktok.com, instagram.com</div>`;
}

// ---------- Прогресс ----------
const GOAL = 5;
function progressHtml() {
  const st = state.me.stats ?? { stars: 0, subs: 0, today: 0, streak: 0 };
  const pct = Math.min(100, Math.round((st.today / GOAL) * 100));
  return `<div class="progress">
    <div class="nums"><span>⭐ Звёзды: ${st.stars}</span><span>➕ Подписки: ${st.subs}</span><span>🔥 ${st.streak} ${days(st.streak)} подряд</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="goal">${st.today >= GOAL ? "Цель дня выполнена 🎉" : `Сегодня ${st.today} из ${GOAL} обменов`}</div>
  </div>`;
}
const days = (n) => (n % 10 === 1 && n % 100 !== 11 ? "день" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "дня" : "дней");

function toast(text) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3300);
}
const WHAT = { book: "⭐ звезда книге", profile: "подписка на профиль", tg: "подписка в ТГ", vk: "подписка в ВК",
  boosty: "подписка на Бусти", tiktok: "подписка в TikTok", insta: "подписка в Instagram" };
function showEvents(events) {
  (events ?? []).slice(0, 4).forEach((e, i) => setTimeout(() => {
    toast(e.is_reply ? `+1 ${WHAT[e.field]} от ${e.name}` : `${e.name} ждёт вашего ответа: ${WHAT[e.field]}`);
    tg.HapticFeedback?.notificationOccurred("success");
  }, 400 + i * 900));
}
function updateBadge() {
  const b = document.querySelector('nav button[data-tab="inbox"]');
  const n = state.me.unanswered ?? 0;
  b.innerHTML = `Входящие${n ? `<span class="badge">${n}</span>` : ""}`;
}
async function refreshMe() {
  const me = await api("me");
  if (me.error) return;
  state.me = me; updateBadge(); showEvents(me.events);
}

// ---------- Лента ----------
async function renderFeed() {
  const mine = Object.keys(FIELDS).filter((f) => state.me.user[f]);
  if (!mine.length) {
    $app.innerHTML = `<div class="empty">Заполните хотя бы одно поле в профиле, и здесь появятся карточки авторов с тем же полем.</div>`;
    return;
  }
  $app.innerHTML = progressHtml() + `<div id="slot" class="empty">Загрузка…</div>`;
  // Одна общая лента вперемешку: по кругу берём следующую карточку из каждого заполненного поля.
  let card = null;
  for (let i = 0; i < mine.length && !card; i++) {
    const f = mine[(state.rr ?? 0) % mine.length];
    state.rr = (state.rr ?? 0) + 1;
    card = (await api("feed", { field: f })).card;
  }
  state.card = card;
  const slot = document.getElementById("slot");
  if (!card) { slot.textContent = "Новых карточек пока нет. Загляните позже."; return; }
  slot.className = "card";
  slot.innerHTML = `<div class="chip on" style="display:inline-block;margin-bottom:12px">${FIELDS[card.field].name}</div>` + cardHtml(card) + `
    <div class="row">
      <button class="btn ghost" data-act="skip">Дальше</button>
      <button class="btn" data-act="shot">📎 Прикрепить скрин</button>
    </div>
    <div class="paste">С компьютера: сделайте скрин и нажмите Ctrl+V (Cmd+V) прямо здесь</div>
    <div class="row"><button class="btn ghost" data-act="chat">Уже обменялись в чате</button></div>
    <button class="report" data-act="report">Пожаловаться</button>`;
  state.upload = { field: card.field, to_id: card.tg_id, reply: false };
}

// ---------- Входящие ----------
async function renderInbox() {
  $app.innerHTML = `<div class="empty">Загрузка…</div>`;
  const { items } = await api("inbox");
  state.upload = null;
  if (!items?.length) { $app.innerHTML = `<div class="empty">Пока пусто.</div>`; return; }
  $app.innerHTML = items.map((it) => {
    const c = it.card;
    let title, buttons;
    if (it.kind === "reply") {
      title = `Выполнил(а) ваше задание. Ответьте тем же: ${FIELDS[c.field].task.toLowerCase()}`;
      buttons = `<button class="btn red" data-reject="${it.id}">❌ Это не то</button>
                 <button class="btn" data-reply="${it.id}">📎 Ответить скрином</button>`;
    } else if (it.kind === "received") {
      title = it.is_reply ? "Ответил(а) вам взаимностью" : "Вы уже ответили взаимностью";
      buttons = `<button class="btn red" data-reject="${it.id}">❌ Это не то</button>`;
    } else {
      title = `Ваш скрин не принят. Пришлите заново: ${FIELDS[c.field].task.toLowerCase()}`;
      buttons = `<button class="btn" data-resend="${it.id}">📎 Прислать заново</button>`;
    }
    return `<div class="card item" data-item="${it.id}">${cardHtml(c, title)}
      ${it.shot ? `<img class="shot" src="${esc(it.shot)}" alt="скрин">` : ""}
      <div class="row">${buttons}</div>
      ${it.shot ? `<button class="report" data-shotreport="${it.id}">Пожаловаться на скрин</button>` : ""}</div>`;
  }).join("");
  state.items = Object.fromEntries(items.map((it) => [it.id, it]));
}

// ---------- Профиль ----------
function renderProfile() {
  const u = state.me.user;
  const inputs = Object.entries(FIELDS).map(([f, d]) =>
    `<label>${d.name}</label><input type="url" name="${f}" value="${esc(u[f] ?? "")}" placeholder="${d.hint}">`).join("");
  $app.innerHTML = `<div class="me"><button class="ava-btn" data-act="ava">${avatar({ name: u.name, photo: u.photo_custom ?? u.photo_url })}</button>
    <div class="paste" style="margin:0 0 8px">Нажмите на фото, чтобы поменять</div><h2>${esc(u.name ?? "")}</h2><div class="rating">${badge(state.me.rating)}</div></div>
    <form id="pf">${inputs}
      <div class="row"><button class="btn" type="submit">Сохранить</button></div>
    </form>
    <div class="row"><button class="btn ghost" data-act="invite">Пригласить автора</button></div>
    <div class="bonus">За каждого приглашённого, кто сделает первый обмен, ваша карточка сутки показывается всем наверху</div>
    <div class="safe" style="text-align:center">Нужна другая площадка? Напишите <button class="report" style="margin:0" data-open="https://t.me/alexaai111">@alexaai111</button></div>
    <div class="safe" style="text-align:center">Все поля по желанию. Принимаются только ссылки litres.ru, t.me, vk.com, boosty.to, tiktok.com, instagram.com.</div>`;
  document.getElementById("pf").onsubmit = async (e) => {
    e.preventDefault();
    const data = {}; let ok = true;
    for (const inp of e.target.querySelectorAll("input")) {
      const v = inp.value.trim();
      const bad = v && !PATTERN[inp.name].test(v);
      inp.classList.toggle("bad", !!bad);
      if (bad) ok = false;
      data[inp.name] = v;
    }
    if (!ok) { tg.showAlert("Проверьте ссылки, выделенные красным."); return; }
    const r = await api("save", data);
    if (r.error) { tg.showAlert("Ссылка не прошла проверку: " + FIELDS[r.error].name); return; }
    Object.assign(state.me.user, Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v || null])));
    tg.HapticFeedback?.notificationOccurred("success");
    tg.showAlert("Сохранено.");
  };
}

// ---------- Скрин ----------
function compress(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function sendShot(file) {
  if (!state.upload || !file?.type.startsWith("image/")) return;
  const image = await compress(file);
  const r = await api("shot", { ...state.upload, image });
  if (r.error) { tg.showAlert("Не получилось отправить скрин. Попробуйте ещё раз."); return; }
  const done = document.getElementById("done");
  done.classList.add("show");
  tg.HapticFeedback?.notificationOccurred("success");
  setTimeout(async () => { done.classList.remove("show"); await refreshMe(); render(); }, 1200);
}

document.getElementById("file").onchange = (e) => { sendShot(e.target.files[0]); e.target.value = ""; };
document.getElementById("ava").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file?.type.startsWith("image/")) return;
  const r = await api("avatar", { image: await compress(file, 512) });
  if (r.url) { state.me.user.photo_custom = r.url; renderProfile(); }
};
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith("image/"));
  if (item) sendShot(item.getAsFile());
});

// ---------- Клики ----------
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b === t));
    state.tab = t.dataset.tab; render();
  } else if (t.dataset.field) {
    state.field = t.dataset.field; renderFeed();
  } else if (t.dataset.open) {
    t.dataset.open.startsWith("https://t.me/") ? tg.openTelegramLink(t.dataset.open) : tg.openLink(t.dataset.open);
  } else if (t.dataset.act === "skip") {
    await api("skip", { field: state.card.field, to_id: state.card.tg_id }); renderFeed();
  } else if (t.dataset.act === "report") {
    document.getElementById("sheet").classList.add("show");
  } else if (t.dataset.reason !== undefined) {
    document.getElementById("sheet").classList.remove("show");
    if (t.dataset.reason) {
      await api("report", { to_id: state.card.tg_id, reason: t.dataset.reason });
      tg.showAlert("Жалоба отправлена.");
    }
  } else if (t.dataset.admtab) {
    state.admTab = t.dataset.admtab; drawAdmin();
  } else if (t.dataset.shotreport) {
    tg.showConfirm("Пожаловаться на непристойный скрин? Его увидит администратор.", async (yes) => {
      if (!yes) return;
      await api("report", { task_id: Number(t.dataset.shotreport), reason: "nsfw" });
      tg.showAlert("Жалоба отправлена.");
    });
  } else if (t.dataset.adm) {
    await api("admin_set", { tg_id: Number(t.dataset.adm), [t.dataset.key]: t.dataset.val === "true" });
    renderAdmin();
  } else if (t.dataset.act === "chat") {
    tg.showConfirm("Скрыть эту карточку навсегда? Без скрина и уведомлений.", async (yes) => {
      if (!yes) return;
      await api("skip", { field: state.card.field, to_id: state.card.tg_id, done: true }); renderFeed();
    });
  } else if (t.dataset.act === "ava") {
    document.getElementById("ava").click();
  } else if (t.dataset.act === "shot") {
    document.getElementById("file").click();
  } else if (t.dataset.act === "invite") {
    const link = `https://t.me/${BOT}?startapp=ref_${state.me.user.tg_id}`;
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("Привет! Это бот взаимной поддержки для авторов и блогеров на ЛитРес, ТГ, ВК, Бусти, TikTok, Instagram (можно предложить свою площадку: @alexaai111). Это бесплатно, и запросы на взаимность не тонут в бесконечных чатах, а удобно организованы в умной ленте! Можно делиться с другими, чтобы взаимности было больше.")}`);
  } else if (t.dataset.reply || t.dataset.resend) {
    const it = state.items[t.dataset.reply || t.dataset.resend];
    state.upload = { field: it.card.field, to_id: it.card.tg_id, reply: !!t.dataset.reply || it.is_reply };
    document.getElementById("file").click();
  } else if (t.dataset.reject) {
    tg.showConfirm("Скрин не подтверждает задание?", async (yes) => {
      if (!yes) return;
      await api("reject", { task_id: Number(t.dataset.reject) }); renderInbox();
    });
  }
});

// Текст правил: Content Creator, проверка Brand Guardian.
const RULES = `<b>Профиль</b>
<p>В профиле 7 полей, все по желанию: книга и профиль автора на ЛитРес, группа в Телеграме, ВК, Бусти, TikTok, Instagram. Принимаются только ссылки с litres.ru, t.me, vk.com, vk.ru, boosty.to, tiktok.com и instagram.com, поэтому в карточках нет скама.</p>
<b>Обмен по полям</b>
<p>Книга на книгу, профиль на профиль, группа на группу. В ленте вы видите авторов, у которых заполнено то же поле.</p>
<b>Как обменяться</b>
<p>Откройте ссылку в карточке, поставьте книге 5 звёзд или подпишитесь, вернитесь и прикрепите скрин. С компьютера его можно вставить через Ctrl+V. Автор получит ваш скрин и карточку, а в ответ пришлёт свой скрин.</p>
<b>Скрин обязателен</b>
<p>Если скрин не подтверждает задание, автор нажмёт «Это не то», и скрин нужно будет прислать заново. Если вам не ответили, через 24 часа бот напомнит автору, а через 48 часов сообщит вам.</p>
<b>Рейтинг</b>
<p>Это процент обменов, на которые человек ответил взаимностью. Рейтинг виден всем: 🟢 от 80%, 🟡 от 50 до 79%, 🔴 меньше 50%, ⚪ новичок.</p>
<b>Порядок в ленте</b>
<p>Выше показываются те, кто больше отдаёт, чем получает. Если у автора 10 обменов без ответа, его карточка временно скрывается, пока он не ответит.</p>
<b>Кнопки</b>
<p>«Уже обменялись в чате» скрывает карточку навсегда, без скрина и уведомлений. «Дальше» отправляет её в конец очереди.</p>
<b>Приглашения</b>
<p>Новый автор, пришедший по вашей ссылке, первой увидит вашу карточку. За каждого приглашённого, который сделал первый обмен, ваша карточка сутки показывается всем в начале ленты.</p>
<b>Жалобы</b>
<p>Пожаловаться можно на ссылку со скамом, фейковые скрины или другое нарушение. После 3 жалоб от разных людей карточка скрывается до решения администратора. За нарушения он может заблокировать доступ.</p>`;

const REASON = { scam: "скам-ссылка", fake: "фейковые скрины", nsfw: "непристойный скрин", other: "другое" };

// Админка: вкладки «Жалобы», «Скрытые», «Все» и поиск по имени.
async function renderAdmin() {
  $app.innerHTML = `<div class="empty">Загрузка…</div>`;
  const { users } = await api("admin_list");
  state.admUsers = users ?? [];
  drawAdmin();
}

function drawAdmin() {
  const tab = state.admTab ?? "reports";
  const q = (state.admQuery ?? "").toLowerCase();
  let list = state.admUsers;
  if (tab === "reports") list = list.filter((u) => u.reports.length).sort((a, b) => b.reports.length - a.reports.length);
  if (tab === "hidden") list = list.filter((u) => u.hidden || u.banned);
  if (q) list = list.filter((u) => (u.name ?? "").toLowerCase().includes(q));
  const count = (t) => t === "reports" ? state.admUsers.filter((u) => u.reports.length).length
    : t === "hidden" ? state.admUsers.filter((u) => u.hidden || u.banned).length : state.admUsers.length;
  const tabs = [["reports", "Жалобы"], ["hidden", "Скрытые"], ["all", "Все"]].map(([t, n]) =>
    `<button class="chip ${t === tab ? "on" : ""}" data-admtab="${t}">${n} ${count(t)}</button>`).join("");
  $app.innerHTML = `<div class="chips">${tabs}</div>
    <input type="url" id="admq" placeholder="Поиск по имени" value="${esc(state.admQuery ?? "")}" style="margin-bottom:14px">
    <div id="admlist"></div>`;
  document.getElementById("admq").oninput = (e) => { state.admQuery = e.target.value; drawList(); };
  const drawList = () => {
    const qq = (state.admQuery ?? "").toLowerCase();
    const l = qq ? list.filter((u) => (u.name ?? "").toLowerCase().includes(qq)) : list;
    document.getElementById("admlist").innerHTML = l.map((u) => `<div class="card item adm">
      ${avatar(u)}<b>${esc(u.name ?? "Автор")}</b> · ${badge(u.rating)}
      ${u.banned ? " · ⛔ бан" : ""}${u.hidden ? " · 🙈 скрыт" : ""}${u.pinned ? " · 📌" : ""}
      <div class="meta">Отклонённых скринов: ${u.rejected}. Жалоб: ${u.reports.length}</div>
      ${u.reports.map((r) => `<div class="meta">⚠️ ${REASON[r.reason] ?? r.reason}, ${new Date(r.at).toLocaleDateString("ru-RU")}</div>
        ${r.shot ? `<img class="shot" src="${esc(r.shot)}" alt="скрин из жалобы">` : ""}`).join("")}
      <div class="meta">${u.links.map(esc).join("<br>")}</div>
      <div class="row">
        <button class="btn ${u.banned ? "ghost" : "red"}" data-adm="${u.tg_id}" data-key="banned" data-val="${!u.banned}">${u.banned ? "Разбанить" : "Забанить"}</button>
        <button class="btn ghost" data-adm="${u.tg_id}" data-key="hidden" data-val="${!u.hidden}">${u.hidden ? "Вернуть в ленту" : "Скрыть"}</button>
        <button class="btn ghost" data-adm="${u.tg_id}" data-key="pinned" data-val="${!u.pinned}">${u.pinned ? "Открепить" : "Закрепить"}</button>
      </div></div>`).join("") || `<div class="empty">${tab === "reports" ? "Жалоб нет." : tab === "hidden" ? "Скрытых нет." : "Никого не найдено."}</div>`;
  };
  drawList();
}

function render() {
  if (state.tab === "feed") renderFeed();
  else if (state.tab === "inbox") renderInbox();
  else if (state.tab === "rules") $app.innerHTML = `<div class="rules">${RULES}</div>`;
  else if (state.tab === "admin") renderAdmin();
  else renderProfile();
}

(async () => {
  const me = await api("me");
  if (me.error === "banned") { $app.innerHTML = `<div class="empty">Доступ закрыт.</div>`; return; }
  if (me.error) { $app.innerHTML = `<div class="empty">Откройте Взаимно из Telegram.</div>`; return; }
  state.me = me;
  document.getElementById("nav-admin").hidden = !me.user.is_admin;
  updateBadge(); showEvents(me.events);
  if (!Object.keys(FIELDS).some((f) => me.user[f])) {
    state.tab = "profile";
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === "profile"));
  }
  render();
})();
</script>
</body>
</html>
