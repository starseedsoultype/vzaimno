<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Взаимно</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --accent: var(--tg-theme-button-color, #2a9df4);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { padding: 16px 16px 88px; max-width: 520px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--bg2); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; padding: 14px 0; border: 0; background: none; color: var(--hint); font-size: 15px; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
  .chip { flex: none; padding: 8px 14px; border-radius: 18px; border: 0; background: var(--bg2); color: var(--text); font-size: 14px; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--bg2); border-radius: 20px; padding: 24px 20px; text-align: center; }
  .card h2 { margin: 0 0 6px; font-size: 22px; }
  .ava-btn { border: 0; background: none; padding: 0; display: block; margin: 0 auto; }
  .ava { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
    object-fit: cover; background: var(--accent); color: var(--accent-text); font-size: 40px; font-weight: 600; }
  .rating { color: var(--hint); font-size: 14px; }
  .task { margin: 18px 0 6px; font-weight: 600; }
  .link { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--accent); background: none; color: var(--accent); font-size: 16px; word-break: break-all; }
  .safe { color: var(--hint); font-size: 12px; margin-top: 8px; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--hint); font-weight: 400; }
  .btn.red { background: none; color: var(--danger); border: 1px solid var(--danger); font-weight: 400; }
  .paste { margin-top: 10px; color: var(--hint); font-size: 13px; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
  .shot { width: 100%; border-radius: 12px; margin-top: 12px; }
  .item { margin-bottom: 16px; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--hint); }
  input[type=url] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--bg2); background: var(--bg2); color: var(--text); font-size: 15px; }
  input.bad { border-color: var(--danger); }
  .me { text-align: center; margin-bottom: 8px; }
  #done { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 85%, transparent); }
  #done.show { display: flex; }
  #done svg { width: 160px; height: 160px; }
  #done circle { fill: var(--accent); transform-origin: center; animation: pop .35s ease-out; }
  #done path { fill: none; stroke: var(--accent-text); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .45s .25s ease-out forwards; }
  .sheet { position: fixed; inset: 0; display: none; align-items: flex-end; background: rgba(0,0,0,.4); }
  .sheet.show { display: flex; }
  .sheet-box { width: 100%; background: var(--bg); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
  .report { margin-top: 12px; border: 0; background: none; color: var(--hint); font-size: 13px; text-decoration: underline; }
  .bonus { margin-top: 10px; text-align: center; font-weight: 700; font-size: 15px; }
  .rules b { display: block; margin-top: 16px; font-size: 17px; }
  .rules p { margin: 6px 0 0; }
  .adm { text-align: left; }
  .adm .ava { width: 96px; height: 96px; font-size: 36px; margin: 0 0 10px; }
  .adm .meta { color: var(--hint); font-size: 13px; margin-top: 4px; word-break: break-all; }
  .adm .row { flex-wrap: wrap; }
  .adm .btn { flex: 1 1 30%; padding: 10px; font-size: 14px; }
  nav button[hidden] { display: none; }
  .progress { background: var(--bg2); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .progress .nums { display: flex; justify-content: space-between; gap: 8px; }
  .progress .bar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--hint) 25%, transparent); margin-top: 10px; overflow: hidden; }
  .progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s ease; }
  .progress .goal { margin-top: 6px; color: var(--hint); font-size: 13px; }
  .cover { width: 120px; border-radius: 8px; margin: 4px auto 12px; display: block; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 12px; line-height: 18px; }
  #toasts { position: fixed; top: 12px; left: 16px; right: 16px; display: grid; gap: 8px; pointer-events: none; z-index: 10; }
  .toast { background: var(--accent); color: var(--accent-text); padding: 12px 14px; border-radius: 14px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.2); animation: toast 3.2s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-16px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-16px); } }
  .tip { position: relative; background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 10px 12px;
    margin: 12px 0 10px; font-weight: 600; font-size: 14px; text-align: left; animation: bob 1.6s ease-in-out infinite; }
  .tip::after { content: ""; position: absolute; left: 24px; bottom: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--accent); }
  .pulse { animation: ring 1.4s ease-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
  .switch { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; }
  #promo { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    background: rgba(0,0,0,.45); z-index: 20; }
  #promo.show { display: flex; }
  #promo .box { background: var(--bg); border-radius: 24px; padding: 28px 22px 20px; text-align: center; max-width: 360px;
    animation: pop .4s ease-out; }
  #promo .big { font-size: 64px; line-height: 1; animation: bob 1.6s ease-in-out infinite; }
  #promo h2 { margin: 14px 0 8px; font-size: 21px; }
  #promo p { margin: 0 0 18px; color: var(--hint); }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.1); } to { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="feed" class="on">Лента</button>
  <button data-tab="inbox">Входящие</button>
  <button data-tab="profile">Профиль</button>
  <button data-tab="rules">Правила</button>
  <button data-tab="admin" id="nav-admin" hidden>Админ</button>
</nav>
<div id="sheet" class="sheet">
  <div class="sheet-box">
    <div class="task">На что жалоба?</div>
    <button class="btn red" data-reason="scam">Скам-ссылка</button>
    <button class="btn red" data-reason="fake">Фейковые скрины</button>
    <button class="btn red" data-reason="other">Другое</button>
    <button class="btn ghost" data-reason="">Отмена</button>
  </div>
</div>
<div id="toasts"></div>
<div id="promo"><div class="box">
  <div class="big">🚀</div>
  <h2>Ваша карточка первой у всех</h2>
  <p>Пригласите автора. Когда он сделает первый обмен, ваша карточка сутки будет показываться всем первой.</p>
  <button class="btn" data-act="invite" style="width:100%">Пригласить автора</button>
  <button class="btn ghost" data-act="promo-close" style="width:100%;margin-top:10px">Позже</button>
</div></div>
<div id="done"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M28 52 L44 67 L73 36"/></svg></div>
<input id="file" type="file" accept="image/*" hidden>
<input id="ava" type="file" accept="image/*" hidden>

<script>
const API = "https://ogqtywdsplyqwfznqxnu.supabase.co/functions/v1/vzaimno";
const BOT = "vzaimnosub_bot";
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// Язык: выбор человека (localStorage), иначе язык Telegram. Русский для ru/uk/be/kk, всем остальным английский.
const RU_CODES = ["ru", "uk", "be", "kk"];
const LANG = (() => {
  try { const s = localStorage.getItem("vz_lang"); if (s === "ru" || s === "en") return s; } catch {}
  return RU_CODES.includes((tg.initDataUnsafe?.user?.language_code ?? "").slice(0, 2)) ? "ru" : "en";
})();
const t = (ru, en) => (LANG === "en" ? en : ru);
document.documentElement.lang = LANG;
document.title = t("Взаимно", "Vzaimno");

const FIELDS = {
  book:    { name: t("Книга ЛитРес", "LitRes book"),       task: t("Поставьте 5 звёзд книге", "Give the book 5 stars"), hint: t("https://www.litres.ru/book/... или https://www.litres.ru/12345678/", "https://www.litres.ru/book/... or https://www.litres.ru/12345678/") },
  profile: { name: t("Профиль ЛитРес", "LitRes profile"),  task: t("Подпишитесь на профиль автора", "Follow the author's profile"), hint: "https://www.litres.ru/author/..." },
  tg:      { name: t("ТГ-группа", "Telegram group"),       task: t("Подпишитесь на группу", "Join the group"), hint: "https://t.me/..." },
  vk:      { name: t("ВК", "VK"),                          task: t("Подпишитесь на страницу", "Follow the page"), hint: "https://vk.com/..." },
  boosty:  { name: t("Бусти", "Boosty"),                   task: t("Подпишитесь на Бусти", "Subscribe on Boosty"), hint: "https://boosty.to/..." },
  tiktok:  { name: "TikTok",                               task: t("Подпишитесь на TikTok", "Follow on TikTok"), hint: "https://www.tiktok.com/@..." },
  insta:   { name: "Instagram",                            task: t("Подпишитесь на Instagram", "Follow on Instagram"), hint: "https://www.instagram.com/..." },
};
// Поля профиля плюс рилс: подписи для карточек и заданий.
const INFO = { ...FIELDS, reel: { name: t("Рилс", "Reel"), task: t("Оставьте комментарий, сохраните и перешлите (скопируйте ссылку)", "Leave a comment, save it and share it (copy the link)") } };
const REEL = /^https:\/\/((www\.)?instagram\.com\/(reels?|p)\/[\w-]+|(www\.|vm\.)?tiktok\.com\/(@[\w.]+\/video\/\d+|[\w]+)|(m\.)?vk\.(com|ru)\/clip-?\d+_\d+|(www\.)?youtube\.com\/shorts\/[\w-]+)\/?(\?\S*)?$/;
const PATTERN = {
  book: /^https:\/\/(www\.)?litres\.ru\/(book\/\S+|\d+\/?)$/,
  profile: /^https:\/\/(www\.)?litres\.ru\/author\/[\w-]+\/?$/,
  tg: /^https:\/\/t\.me\/[\w+]+\/?$/,
  vk: /^https:\/\/(m\.)?vk\.(com|ru)\/[\w.]+\/?$/,
  boosty: /^https:\/\/(www\.)?boosty\.to\/[\w.-]+\/?(\?\S*)?$/,
  tiktok: /^https:\/\/(www\.)?tiktok\.com\/@[\w.]+\/?(\?\S*)?$/,
  insta: /^https:\/\/(www\.)?instagram\.com\/[\w.]+\/?(\?\S*)?$/,
};
const DOMAINS = "litres.ru, t.me, vk.com, boosty.to, tiktok.com, instagram.com, youtube.com";

const state = { tab: "feed", me: null, field: null, card: null, upload: null };
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Есть ли у человека хоть что-то для обмена: рилс или заполненная площадка.
const hasFields = () => Object.keys(FIELDS).some((f) => state.me.user[f]);
const hasAny = () => hasFields() || (state.reels?.length ?? 0) > 0;

async function api(action, body = {}) {
  const ref = new URLSearchParams(location.search).get("ref");
  const r = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ initData: tg.initData, ref, lang: LANG, action, ...body }),
  });
  return r.json();
}

// Статичная разметка (меню, жалоба, промо) на языке человека.
function applyStatic() {
  const NAV = { feed: t("Лента", "Feed"), inbox: t("Входящие", "Inbox"), profile: t("Профиль", "Profile"), rules: t("Правила", "Rules"), admin: t("Админ", "Admin") };
  document.querySelectorAll("nav button").forEach((b) => { b.textContent = NAV[b.dataset.tab]; });
  document.querySelector("#sheet .sheet-box").innerHTML = `
    <div class="task">${t("На что жалоба?", "What's the problem?")}</div>
    <button class="btn red" data-reason="scam">${t("Скам-ссылка", "Scam link")}</button>
    <button class="btn red" data-reason="fake">${t("Фейковые скрины", "Fake screenshots")}</button>
    <button class="btn red" data-reason="other">${t("Другое", "Other")}</button>
    <button class="btn ghost" data-reason="">${t("Отмена", "Cancel")}</button>`;
  document.querySelector("#promo .box").innerHTML = `
    <div class="big">🚀</div>
    <h2>${t("Ваша карточка первой у всех", "Your card first for everyone")}</h2>
    <p>${t("Пригласите автора. Когда он сделает первый обмен, ваша карточка сутки будет показываться всем первой.",
      "Invite a creator. When they make their first swap, your card is shown first to everyone for 24 hours.")}</p>
    <button class="btn" data-act="invite" style="width:100%">${t("Пригласить автора", "Invite a creator")}</button>
    <button class="btn ghost" data-act="promo-close" style="width:100%;margin-top:10px">${t("Позже", "Later")}</button>`;
}

function badge(r) {
  if (r == null) return t("⚪ новичок", "⚪ newcomer");
  return `${r >= 80 ? "🟢" : r >= 50 ? "🟡" : "🔴"} ${r}% ${t("взаимности", "mutual")}`;
}

// Фото из Telegram; если человек его скрыл, первая буква имени.
function avatar(c) {
  return c.photo
    ? `<img class="ava" src="${esc(c.photo)}" alt="">`
    : `<div class="ava">${esc((c.name ?? "?").slice(0, 1).toUpperCase())}</div>`;
}

// Обложка книги ЛитРес по номеру из ссылки; если её нет, картинка просто скрывается.
function cover(c) {
  const id = c.field === "book" && /(\d+)\/?$/.exec(c.url ?? "")?.[1];
  return id ? `<img class="cover" src="https://cdn.litres.ru/pub/c/cover_415/${id}.jpg" alt="" onerror="this.remove()">` : "";
}

function cardHtml(c, task) {
  return `${cover(c)}${avatar(c)}<h2>${esc(c.name)}</h2>
    <div class="rating">${badge(c.rating)}</div>
    <div class="task">${esc(task ?? INFO[c.field].task)}</div>
    <button class="link" data-open="${esc(c.url)}">${esc(c.url)}</button>
    <div class="safe">🔒 ${t("Ссылки проверены: только", "Links are checked: only")} ${DOMAINS}</div>`;
}

// ---------- Прогресс ----------
const GOAL = 5;
function progressHtml() {
  const st = state.me.stats ?? { stars: 0, subs: 0, today: 0, streak: 0 };
  const pct = Math.min(100, Math.round((st.today / GOAL) * 100));
  return `<div class="progress">
    <div class="nums"><span>⭐ ${t("Звёзды", "Stars")}: ${st.stars}</span><span>➕ ${t("Подписки", "Follows")}: ${st.subs}</span><span>🔥 ${t(`${st.streak} ${days(st.streak)} подряд`, `${st.streak}-day streak`)}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="goal">${st.today >= GOAL ? t("Цель дня выполнена 🎉", "Daily goal done 🎉") : t(`Сегодня ${st.today} из ${GOAL} обменов`, `Today: ${st.today} of ${GOAL} swaps`)}</div>
  </div>`;
}
const days = (n) => (n % 10 === 1 && n % 100 !== 11 ? "день" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "дня" : "дней");

function toast(text) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3300);
}
const WHAT = LANG === "en"
  ? { book: "⭐ book star", profile: "profile follow", tg: "Telegram follow", vk: "VK follow",
      reel: "reel support", boosty: "Boosty follow", tiktok: "TikTok follow", insta: "Instagram follow" }
  : { book: "⭐ звезда книге", profile: "подписка на профиль", tg: "подписка в ТГ", vk: "подписка в ВК",
      reel: "поддержка рилса", boosty: "подписка на Бусти", tiktok: "подписка в TikTok", insta: "подписка в Instagram" };
function showEvents(events) {
  (events ?? []).slice(0, 4).forEach((e, i) => setTimeout(() => {
    toast(e.is_reply ? t(`+1 ${WHAT[e.field]} от ${e.name}`, `+1 ${WHAT[e.field]} from ${e.name}`)
      : t(`${e.name} ждёт вашего ответа: ${WHAT[e.field]}`, `${e.name} is waiting for your reply: ${WHAT[e.field]}`));
    tg.HapticFeedback?.notificationOccurred("success");
  }, 400 + i * 900));
}
function updateBadge() {
  const b = document.querySelector('nav button[data-tab="inbox"]');
  const n = state.me.unanswered ?? 0;
  b.innerHTML = `${t("Входящие", "Inbox")}${n ? `<span class="badge">${n}</span>` : ""}`;
}
async function refreshMe() {
  const me = await api("me");
  if (me.error) return;
  state.me = me; updateBadge(); showEvents(me.events);
}

// Рилс скрывается по своему номеру, остальные карточки по полю.
const skipField = (c) => (c.field === "reel" ? `reel:${c.reel_id}` : c.field);

function goTab(tab) {
  state.tab = tab;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  render();
}

// ---------- Лента ----------
async function renderFeed() {
  // Рилсы первыми: лента начинает круг с рилсов, потом площадки.
  const mine = (state.reels?.length ? ["reel"] : []).concat(Object.keys(FIELDS).filter((f) => state.me.user[f]));
  if (!mine.length) {
    $app.innerHTML = `<div class="empty">${t("Лента откроется, когда вы добавите свой рилс или ссылку на площадку. Начните с рилса: так быстрее всего получить первые поддержки.",
      "Your feed opens once you add your reel or a platform link. Start with a reel: it's the fastest way to get your first support.")}
      <div class="row"><button class="btn" data-tab-go="profile">🎬 ${t("Добавить рилс", "Add my reel")}</button></div></div>`;
    return;
  }
  $app.innerHTML = progressHtml() + `<div id="slot" class="empty">${t("Загрузка…", "Loading…")}</div>`;
  // Одна общая лента вперемешку: по кругу берём следующую карточку из каждого заполненного поля.
  let card = null;
  for (let i = 0; i < mine.length && !card; i++) {
    const f = mine[(state.rr ?? 0) % mine.length];
    state.rr = (state.rr ?? 0) + 1;
    card = (await api("feed", { field: f })).card;
  }
  state.card = card;
  const slot = document.getElementById("slot");
  if (!card) { slot.textContent = t("Новых карточек пока нет. Загляните позже.", "No new cards yet. Check back later."); return; }
  slot.className = "card";
  slot.innerHTML = `<div class="chip on" style="display:inline-block;margin-bottom:12px">${INFO[card.field].name}</div>` + cardHtml(card) + `
    <div class="row">
      <button class="btn ghost" data-act="skip">${t("Дальше", "Skip")}</button>
      <button class="btn" data-act="shot">📎 ${t("Прикрепить скрин", "Attach screenshot")}</button>
    </div>
    <div class="paste">${t("С компьютера: сделайте скрин и нажмите Ctrl+V (Cmd+V) прямо здесь", "On a computer: take a screenshot and press Ctrl+V (Cmd+V) right here")}</div>
    <div class="row"><button class="btn ghost" data-act="chat">${t("Уже обменялись в чате", "Already swapped in a chat")}</button></div>
    <button class="report" data-act="report">${t("Пожаловаться", "Report")}</button>`;
  state.upload = { field: card.field, to_id: card.tg_id, reply: false, reel_id: card.reel_id };
  // Обучение на живой карточке: пока человек не сделал ни одного обмена.
  if (!state.me.stats?.given) {
    const link = slot.querySelector(".link");
    link.classList.add("pulse");

// ---------- Скрин ----------
function compress(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function sendShot(file) {
  if (!state.upload || !file?.type.startsWith("image/")) return;
  const image = await compress(file);
  const r = await api("shot", { ...state.upload, image });
  if (r.error === "noreel") { tg.showAlert(t("Чтобы поддерживать рилсы, добавьте свой рилс в профиле.", "To support reels, add your own reel in your profile first.")); return; }
  if (r.error) { tg.showAlert(t("Не получилось отправить скрин. Попробуйте ещё раз.", "Couldn't send the screenshot. Please try again.")); return; }
  const done = document.getElementById("done");
  done.classList.add("show");
  tg.HapticFeedback?.notificationOccurred("success");
  setTimeout(async () => { done.classList.remove("show"); await refreshMe(); render(); }, 1200);
}

document.getElementById("file").onchange = (e) => { sendShot(e.target.files[0]); e.target.value = ""; };
document.getElementById("ava").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file?.type.startsWith("image/")) return;
  const r = await api("avatar", { image: await compress(file, 512) });
  if (r.url) { state.me.user.photo_custom = r.url; renderProfile(); }
};
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith("image/"));
  if (item) sendShot(item.getAsFile());
});

      <div class="meta">${u.links.map(esc).join("<br>")}</div>
      <div class="row">
        <button class="btn ${u.banned ? "ghost" : "red"}" data-adm="${u.tg_id}" data-key="banned" data-val="${!u.banned}">${u.banned ? "Разбанить" : "Забанить"}</button>
        <button class="btn ghost" data-adm="${u.tg_id}" data-key="hidden" data-val="${!u.hidden}">${u.hidden ? "Вернуть в ленту" : "Скрыть"}</button>
        <button class="btn ghost" data-adm="${u.tg_id}" data-key="pinned" data-val="${!u.pinned}">${u.pinned ? "Открепить" : "Закрепить"}</button>
      </div></div>`).join("") || `<div class="empty">${tab === "reports" ? "Жалоб нет." : tab === "hidden" ? "Скрытых нет." : "Никого не найдено."}</div>`;
  };
  drawList();
}

function render() {
  if (state.tab === "feed") renderFeed();
  else if (state.tab === "inbox") renderInbox();
  else if (state.tab === "rules") $app.innerHTML = `<div class="rules">${t(RULES_RU, RULES_EN)}</div>`;
  else if (state.tab === "admin") renderAdmin();
  else renderProfile();
}

(async () => {
  applyStatic();
  const me = await api("me");
  if (me.error === "banned") { $app.innerHTML = `<div class="empty">${t("Доступ закрыт.", "Access closed.")}</div>`; return; }
  if (me.error) { $app.innerHTML = `<div class="empty">${t("Откройте Взаимно из Telegram.", "Open Vzaimno from Telegram.")}</div>`; return; }
  state.me = me;
  document.getElementById("nav-admin").hidden = !me.user.is_admin;
  updateBadge(); showEvents(me.events);
  state.reels = (await api("reels")).reels ?? [];
  // Раз в день при входе: предложение пригласить автора (только тем, у кого уже есть рилс или площадка).
  try {
    const today = new Date().toISOString().slice(0, 10);
    if (hasAny() && localStorage.getItem("vz_promo") !== today) {
      localStorage.setItem("vz_promo", today);
      setTimeout(() => document.getElementById("promo").classList.add("show"), 1500);
    }
  } catch {}
  if (!hasAny()) state.tab = "profile";
  goTab(state.tab);
})();
</script>
</body>
</html>
