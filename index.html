<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Взаимно</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --accent: var(--tg-theme-button-color, #2a9df4);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { padding: 16px 16px 88px; max-width: 520px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--bg2); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; padding: 14px 0; border: 0; background: none; color: var(--hint); font-size: 15px; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
  .chip { flex: none; padding: 8px 14px; border-radius: 18px; border: 0; background: var(--bg2); color: var(--text); font-size: 14px; }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--bg2); border-radius: 20px; padding: 24px 20px; text-align: center; }
  .card h2 { margin: 0 0 6px; font-size: 22px; }
  .ava { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
    object-fit: cover; background: var(--accent); color: var(--accent-text); font-size: 40px; font-weight: 600; }
  .rating { color: var(--hint); font-size: 14px; }
  .task { margin: 18px 0 6px; font-weight: 600; }
  .link { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--accent); background: none; color: var(--accent); font-size: 16px; word-break: break-all; }
  .safe { color: var(--hint); font-size: 12px; margin-top: 8px; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--hint); font-weight: 400; }
  .btn.red { background: none; color: var(--danger); border: 1px solid var(--danger); font-weight: 400; }
  .paste { margin-top: 10px; color: var(--hint); font-size: 13px; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
  .shot { width: 100%; border-radius: 12px; margin-top: 12px; }
  .item { margin-bottom: 16px; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--hint); }
  input[type=url] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--bg2); background: var(--bg2); color: var(--text); font-size: 15px; }
  input.bad { border-color: var(--danger); }
  .me { text-align: center; margin-bottom: 8px; }
  #done { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 85%, transparent); }
  #done.show { display: flex; }
  #done svg { width: 160px; height: 160px; }
  #done circle { fill: var(--accent); transform-origin: center; animation: pop .35s ease-out; }
  #done path { fill: none; stroke: var(--accent-text); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .45s .25s ease-out forwards; }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.1); } to { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="feed" class="on">Лента</button>
  <button data-tab="inbox">Входящие</button>
  <button data-tab="profile">Профиль</button>
</nav>
<div id="done"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M28 52 L44 67 L73 36"/></svg></div>
<input id="file" type="file" accept="image/*" hidden>

<script>
const API = "https://ogqtywdsplyqwfznqxnu.supabase.co/functions/v1/vzaimno";
const BOT = "vzaimnosub_bot";
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const FIELDS = {
  book:    { name: "Книга ЛитРес",   task: "Поставьте 5 звёзд книге", hint: "https://www.litres.ru/book/... или https://www.litres.ru/12345678/" },
  profile: { name: "Профиль ЛитРес", task: "Подпишитесь на профиль автора", hint: "https://www.litres.ru/author/..." },
  tg:      { name: "ТГ-группа",      task: "Подпишитесь на группу", hint: "https://t.me/..." },
  vk:      { name: "ВК",             task: "Подпишитесь на страницу", hint: "https://vk.com/..." },
  boosty:  { name: "Бусти",          task: "Подпишитесь на Бусти", hint: "https://boosty.to/..." },
};
const PATTERN = {
  book: /^https:\/\/(www\.)?litres\.ru\/(book\/\S+|\d+\/?)$/,
  profile: /^https:\/\/(www\.)?litres\.ru\/author\/[\w-]+\/?$/,
  tg: /^https:\/\/t\.me\/[\w+]+\/?$/,
  vk: /^https:\/\/(m\.)?vk\.(com|ru)\/[\w.]+\/?$/,
  boosty: /^https:\/\/(www\.)?boosty\.to\/[\w.-]+\/?(\?\S*)?$/,
};

const state = { tab: "feed", me: null, field: null, card: null, upload: null };
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(action, body = {}) {
  const ref = new URLSearchParams(location.search).get("ref");
  const r = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ initData: tg.initData, ref, action, ...body }),
  });
  return r.json();
}

function badge(r) {
  if (r == null) return "⚪ новичок";
  return `${r >= 80 ? "🟢" : r >= 50 ? "🟡" : "🔴"} ${r}% взаимности`;
}

// Фото из Telegram; если человек его скрыл, первая буква имени.
function avatar(c) {
  return c.photo
    ? `<img class="ava" src="${esc(c.photo)}" alt="">`
    : `<div class="ava">${esc((c.name ?? "?").slice(0, 1).toUpperCase())}</div>`;
}

function cardHtml(c, task) {
  return `${avatar(c)}<h2>${esc(c.name)}</h2>
    <div class="rating">${badge(c.rating)}</div>
    <div class="task">${esc(task ?? FIELDS[c.field].task)}</div>
    <button class="link" data-open="${esc(c.url)}">${esc(c.url)}</button>
    <div class="safe">🔒 Ссылки проверены: только litres.ru, t.me, vk.com, boosty.to</div>`;
}

// ---------- Лента ----------
async function renderFeed() {
  const mine = Object.keys(FIELDS).filter((f) => state.me.user[f]);
  if (!mine.length) {
    $app.innerHTML = `<div class="empty">Заполните хотя бы одно поле в профиле, и здесь появятся карточки авторов с тем же полем.</div>`;
    return;
  }
  if (!mine.includes(state.field)) state.field = mine[0];
  const chips = mine.map((f) => `<button class="chip ${f === state.field ? "on" : ""}" data-field="${f}">${FIELDS[f].name}</button>`).join("");
  $app.innerHTML = `<div class="chips">${chips}</div><div id="slot" class="empty">Загрузка…</div>`;
  const { card } = await api("feed", { field: state.field });
  state.card = card;
  const slot = document.getElementById("slot");
  if (!card) { slot.textContent = "Новых карточек пока нет. Загляните позже."; return; }
  slot.className = "card";
  slot.innerHTML = cardHtml(card) + `
    <div class="row">
      <button class="btn ghost" data-act="skip">Дальше</button>
      <button class="btn" data-act="shot">📎 Прикрепить скрин</button>
    </div>
    <div class="paste">С компьютера: сделайте скрин и нажмите Ctrl+V (Cmd+V) прямо здесь</div>`;
  state.upload = { field: card.field, to_id: card.tg_id, reply: false };
}

// ---------- Входящие ----------
async function renderInbox() {
  $app.innerHTML = `<div class="empty">Загрузка…</div>`;
  const { items } = await api("inbox");
  state.upload = null;
  if (!items?.length) { $app.innerHTML = `<div class="empty">Пока пусто.</div>`; return; }
  $app.innerHTML = items.map((it) => {
    const c = it.card;
    let title, buttons;
    if (it.kind === "reply") {
      title = `Выполнил(а) ваше задание. Ответьте тем же: ${FIELDS[c.field].task.toLowerCase()}`;
      buttons = `<button class="btn red" data-reject="${it.id}">❌ Это не то</button>
                 <button class="btn" data-reply="${it.id}">📎 Ответить скрином</button>`;
    } else if (it.kind === "received") {
      title = it.is_reply ? "Ответил(а) вам взаимностью" : "Вы уже ответили взаимностью";
      buttons = `<button class="btn red" data-reject="${it.id}">❌ Это не то</button>`;
    } else {
      title = `Ваш скрин не принят. Пришлите заново: ${FIELDS[c.field].task.toLowerCase()}`;
      buttons = `<button class="btn" data-resend="${it.id}">📎 Прислать заново</button>`;
    }
    return `<div class="card item" data-item="${it.id}">${cardHtml(c, title)}
      ${it.shot ? `<img class="shot" src="${esc(it.shot)}" alt="скрин">` : ""}
      <div class="row">${buttons}</div></div>`;
  }).join("");
  state.items = Object.fromEntries(items.map((it) => [it.id, it]));
}

// ---------- Профиль ----------
function renderProfile() {
  const u = state.me.user;
  const inputs = Object.entries(FIELDS).map(([f, d]) =>
    `<label>${d.name}</label><input type="url" name="${f}" value="${esc(u[f] ?? "")}" placeholder="${d.hint}">`).join("");
  $app.innerHTML = `<div class="me">${avatar({ name: u.name, photo: u.photo_url })}<h2>${esc(u.name ?? "")}</h2><div class="rating">${badge(state.me.rating)}</div></div>
    <form id="pf">${inputs}
      <div class="row"><button class="btn" type="submit">Сохранить</button></div>
    </form>
    <div class="row"><button class="btn ghost" data-act="invite">Пригласить автора</button></div>
    <div class="safe" style="text-align:center">Все поля по желанию. Принимаются только ссылки litres.ru, t.me, vk.com, boosty.to.</div>`;
  document.getElementById("pf").onsubmit = async (e) => {
    e.preventDefault();
    const data = {}; let ok = true;
    for (const inp of e.target.querySelectorAll("input")) {
      const v = inp.value.trim();
      const bad = v && !PATTERN[inp.name].test(v);
      inp.classList.toggle("bad", !!bad);
      if (bad) ok = false;
      data[inp.name] = v;
    }
    if (!ok) { tg.showAlert("Проверьте ссылки, выделенные красным."); return; }
    const r = await api("save", data);
    if (r.error) { tg.showAlert("Ссылка не прошла проверку: " + FIELDS[r.error].name); return; }
    Object.assign(state.me.user, Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v || null])));
    tg.HapticFeedback?.notificationOccurred("success");
    tg.showAlert("Сохранено.");
  };
}

// ---------- Скрин ----------
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function sendShot(file) {
  if (!state.upload || !file?.type.startsWith("image/")) return;
  const image = await compress(file);
  const r = await api("shot", { ...state.upload, image });
  if (r.error) { tg.showAlert("Не получилось отправить скрин. Попробуйте ещё раз."); return; }
  const done = document.getElementById("done");
  done.classList.add("show");
  tg.HapticFeedback?.notificationOccurred("success");
  setTimeout(() => { done.classList.remove("show"); render(); }, 1200);
}

document.getElementById("file").onchange = (e) => { sendShot(e.target.files[0]); e.target.value = ""; };
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith("image/"));
  if (item) sendShot(item.getAsFile());
});

// ---------- Клики ----------
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b === t));
    state.tab = t.dataset.tab; render();
  } else if (t.dataset.field) {
    state.field = t.dataset.field; renderFeed();
  } else if (t.dataset.open) {
    t.dataset.open.startsWith("https://t.me/") ? tg.openTelegramLink(t.dataset.open) : tg.openLink(t.dataset.open);
  } else if (t.dataset.act === "skip") {
    await api("skip", { field: state.card.field, to_id: state.card.tg_id }); renderFeed();
  } else if (t.dataset.act === "shot") {
    document.getElementById("file").click();
  } else if (t.dataset.act === "invite") {
    const link = `https://t.me/${BOT}?startapp=ref_${state.me.user.tg_id}`;
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("Давайте меняться во «Взаимно»: там скрины и рейтинг.")}`);
  } else if (t.dataset.reply || t.dataset.resend) {
    const it = state.items[t.dataset.reply || t.dataset.resend];
    state.upload = { field: it.card.field, to_id: it.card.tg_id, reply: !!t.dataset.reply || it.is_reply };
    document.getElementById("file").click();
  } else if (t.dataset.reject) {
    tg.showConfirm("Скрин не подтверждает задание?", async (yes) => {
      if (!yes) return;
      await api("reject", { task_id: Number(t.dataset.reject) }); renderInbox();
    });
  }
});

function render() {
  if (state.tab === "feed") renderFeed();
  else if (state.tab === "inbox") renderInbox();
  else renderProfile();
}

(async () => {
  const me = await api("me");
  if (me.error) { $app.innerHTML = `<div class="empty">Откройте Взаимно из Telegram.</div>`; return; }
  state.me = me;
  if (!Object.keys(FIELDS).some((f) => me.user[f])) {
    state.tab = "profile";
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === "profile"));
  }
  render();
})();
</script>
</body>
</html>
